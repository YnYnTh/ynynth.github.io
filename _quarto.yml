project:
  type: website
  output-dir: _site
  # Rebuilds the publications list from publications.bib before every render.
  # Runs in GitHub Actions too, so pushing an updated .bib is enough.
  pre-render:
    - _scripts/build_publications.py

  # Only the top-level pages are documents. Anything under files/ is a download
  # (workshop scripts, PDFs); without this Quarto tries to render .Rmd scripts
  # as pages and would execute their code.
  render:
    - "*.qmd"
    - "!files/"

# Frozen computations: if you ever add {r} chunks, Quarto renders them locally
# and CI reuses the cached results. Keeps GitHub Actions fast and R-free.
execute:
  freeze: auto

website:
  title: "Yingying Tang"
  description: "Yingying Tang — doctoral candidate in Human Development and Family Sciences at UT Austin, studying emotion regulation, stress, and physiological health across family and peer contexts."
  # EDIT: replace USERNAME (and swap for your custom domain if you buy one)
  site-url: "https://USERNAME.github.io"

  # Off deliberately: the search widget bundles Algolia's autocomplete, which
  # carries a cdn.jsdelivr.net loader for its optional analytics module.
  # Inert unless insights are enabled, but not worth the risk on a small site.
  search: false

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: projects.qmd
        text: Dead Ends?
    right:
      - icon: github
        href: https://github.com/USERNAME
        aria-label: GitHub

  page-footer:
    left: "© 2026 Yingying Tang"
    right: "Built with Quarto · no third-party trackers"

format:
  html:
    # A bare .scss layers on plain Bootstrap, which loads no external fonts.
    # Do NOT switch to a Bootswatch theme (cosmo, flatly, ...) without care:
    # they @import Google Fonts, blocked in mainland China. styles.scss nulls
    # $web-font-path as insurance if you ever do.
    theme: styles.scss
    toc: false
    anchor-sections: true
    link-external-newwindow: true
    # 'plain' avoids pulling MathJax/KaTeX from a CDN. If you need real
    # equations, switch to katex and verify it loads from a China test point.
    html-math-method: plain
