name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The pre-render script that builds the publications list is plain
      # Python 3 with no third-party imports, but Quarto invokes it by file
      # extension, so guarantee an interpreter is on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No R setup needed: with `freeze: auto`, any {r} chunks are rendered
      # locally and committed under _freeze/, so CI only renders markdown.
      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
